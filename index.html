<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RenameCheetah</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="panels">
    <!-- Left Panel: Scripts List -->
    <div id="left-panel">
      <div class="panel-header">Scripts</div>
      <div id="scripts-list"></div>
      <div class="panel-buttons">
        <button id="add-script" title="Add Script">+</button>
        <button id="del-script" title="Delete Script">−</button>
        <button id="dup-script" title="Duplicate Script">⧉</button>
      </div>
    </div>

    <div class="divider" id="divider-left"></div>

    <!-- Middle Panel: Script Steps -->
    <div id="middle-panel">
      <div class="panel-header">Steps</div>
      <div id="steps-list"></div>
      <div class="panel-buttons">
        <button id="add-step" title="Add Step">+</button>
        <button id="del-step" title="Delete Step">−</button>
      </div>
    </div>

    <div class="divider" id="divider-right"></div>

    <!-- Right Panel: File Drop & Preview -->
    <div id="right-panel">
      <div class="panel-header">Files</div>
      <div id="file-drop-zone">
        <table id="file-table">
          <thead>
            <tr>
              <th id="col-current" class="sortable" style="width:50%">Current Name <span class="sort-arrow">▲</span></th>
              <th class="col-divider-th"><div class="col-divider" id="col-divider"></div></th>
              <th id="col-new" class="sortable">New Name <span class="sort-arrow"></span></th>
            </tr>
          </thead>
          <tbody id="file-tbody"></tbody>
        </table>
        <div id="drop-overlay">Drop files here</div>
      </div>
      <div id="status-bar">
        <button id="rename-btn" disabled title="Rename Files">▶</button>
        <span id="status-text"></span>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer, webUtils } = require("electron");
    const path = require("path");
    const fs = require("fs");
    const nodeCrypto = require("crypto");
    const { execFileSync } = require("child_process");
    const config = JSON.parse(fs.readFileSync(path.join(__dirname, "config.json"), "utf8"));
    const { load, save } = require("./settings");

    // Auto-detect tool paths
    const scoopGlobal = "C:\\ProgramData\\scoop\\shims";
    const scoopUser = (process.env.USERPROFILE || "") + "\\scoop\\shims";
    const FFPROBE_SEARCH = process.platform === "win32"
      ? [scoopGlobal + "\\ffprobe.exe", scoopUser + "\\ffprobe.exe", "C:\\Program Files\\FFmpeg\\bin\\ffprobe.exe", "C:\\Program Files (x86)\\FFmpeg\\bin\\ffprobe.exe"]
      : ["/usr/local/bin/ffprobe", "/opt/homebrew/bin/ffprobe", "/usr/bin/ffprobe"];
    const EXIFTOOL_SEARCH = process.platform === "win32"
      ? [scoopGlobal + "\\exiftool.exe", scoopUser + "\\exiftool.exe", "C:\\Program Files\\ExifTool\\exiftool.exe", "C:\\Windows\\exiftool.exe"]
      : ["/usr/local/bin/exiftool", "/opt/homebrew/bin/exiftool", "/usr/bin/exiftool"];

    function findTool(settingsKey, searchPaths, name) {
      const settings = load();
      if (settings[settingsKey]) return settings[settingsKey];
      // Try bare name (on PATH)
      try { execFileSync(name, ["-version"], { timeout: 3000, stdio: "ignore" }); return name; } catch {}
      // Search common locations
      for (const p of searchPaths) { if (fs.existsSync(p)) return p; }
      return null;
    }

    function getFFprobePath() { return findTool("ffprobePath", FFPROBE_SEARCH, "ffprobe"); }
    function getExiftoolPath() { return findTool("exiftoolPath", EXIFTOOL_SEARCH, "exiftool"); }

    let scripts = [];
    let selectedScriptIdx = -1;
    let selectedStepIdx = -1;
    let files = [];
    let selectedFiles = new Set();
    let sortCol = "current";
    let sortAsc = true;
    let dragSrcIdx = null;

    const PREMIUM_STEPS = ["Add Metadata - Audio", "Add Metadata - Photo", "Add Metadata - Video", "Regular Expression"];
    function isLicensed() {
      const s = load();
      if (!s.licenseKey || !s.userName) return false;
      const hmac = nodeCrypto.createHmac("sha256", "RenameCheetah-2026");
      hmac.update(s.userName.toLowerCase().trim());
      return s.licenseKey.toUpperCase() === hmac.digest("hex").slice(0, 16).toUpperCase();
    }

    // --- Init ---
    function init() {
      const settings = load();
      scripts = settings.scripts || [];
      if (scripts.length > 0) selectedScriptIdx = 0;
      // Set highlight color CSS variables on panels
      const scriptHL = settings.scriptHighlightColor || config.scriptHighlightColor || "#0a84ff";
      const stepHL = settings.stepHighlightColor || config.stepHighlightColor || "#0a84ff";
      const fileHL = settings.fileHighlightColor || config.fileHighlightColor || "#2e7d32";
      document.getElementById("left-panel").style.setProperty("--panel-hl", scriptHL);
      document.getElementById("middle-panel").style.setProperty("--panel-hl", stepHL);
      document.getElementById("right-panel").style.setProperty("--panel-hl", fileHL);
      renderScripts();
      renderSteps();
      updatePreview();
      startAutosave();
    }

    // --- Autosave ---
    function startAutosave() {
      const interval = (config.autosaveIntervalSeconds || 120) * 1000;
      setInterval(() => saveScripts(), interval);
    }

    function saveScripts() {
      const settings = load();
      settings.scripts = scripts;
      save(settings);
    }

    // Save on window close / app quit
    window.addEventListener("beforeunload", () => saveScripts());

    // --- Scripts Panel ---
    function renderScripts() {
      // Keep scripts sorted alphabetically
      const selectedScript = scripts[selectedScriptIdx] || null;
      scripts.sort((a, b) => a.name.localeCompare(b.name));
      if (selectedScript) selectedScriptIdx = scripts.indexOf(selectedScript);
      const list = document.getElementById("scripts-list");
      list.innerHTML = "";
      const scriptHL = load().scriptHighlightColor || config.scriptHighlightColor || "#0a84ff";
      scripts.forEach((s, i) => {
        const div = document.createElement("div");
        div.className = "script-item" + (i === selectedScriptIdx ? " selected" : "");
        if (i === selectedScriptIdx) div.style.background = scriptHL;

        const span = document.createElement("span");
        span.className = "script-name";
        span.textContent = s.name;
        div.appendChild(span);

        div.addEventListener("click", () => {
          if (i !== selectedScriptIdx) { saveScripts(); selectedScriptIdx = i; selectedStepIdx = -1; renderScripts(); renderSteps(); updatePreview(); }
        });

        span.addEventListener("dblclick", (e) => {
          if (i !== selectedScriptIdx) return;
          e.stopPropagation();
          const input = document.createElement("input");
          input.type = "text";
          input.className = "script-name-input";
          input.value = s.name;
          div.replaceChild(input, span);
          input.focus();
          input.select();
          const commit = () => {
            const val = input.value.trim();
            if (val) s.name = val;
            renderScripts();
          };
          input.addEventListener("blur", commit);
          input.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") input.blur();
            if (ev.key === "Escape") { input.value = s.name; input.blur(); }
          });
        });

        list.appendChild(div);
      });
    }

    document.getElementById("add-script").addEventListener("click", () => {
      scripts.push({ name: "Untitled", steps: [] });
      selectedScriptIdx = scripts.length - 1;
      selectedStepIdx = -1;
      renderScripts();
      renderSteps();
      updatePreview();
    });

    document.getElementById("del-script").addEventListener("click", () => {
      if (selectedScriptIdx < 0) return;
      scripts.splice(selectedScriptIdx, 1);
      selectedScriptIdx = Math.min(selectedScriptIdx, scripts.length - 1);
      selectedStepIdx = -1;
      renderScripts();
      renderSteps();
      updatePreview();
    });

    document.getElementById("dup-script").addEventListener("click", () => {
      if (selectedScriptIdx < 0) return;
      const copy = JSON.parse(JSON.stringify(scripts[selectedScriptIdx]));
      copy.name += " Copy";
      scripts.splice(selectedScriptIdx + 1, 0, copy);
      selectedScriptIdx++;
      renderScripts();
      renderSteps();
      updatePreview();
    });

    // --- Steps Panel ---
    function renderSteps() {
      const list = document.getElementById("steps-list");
      list.innerHTML = "";
      const stepHL = load().stepHighlightColor || config.stepHighlightColor || "#0a84ff";
      const script = scripts[selectedScriptIdx];
      if (!script) return;
      const licensed = isLicensed();
      script.steps.forEach((step, i) => {
        const div = document.createElement("div");
        div.className = "step-card" + (i === selectedStepIdx ? " selected" : "");
        if (i === selectedStepIdx) { div.style.borderColor = stepHL; }
        div.style.setProperty("--step-hl", stepHL);
        div.draggable = true;
        div.dataset.idx = i;
        div.addEventListener("mousedown", (e) => {
          if (i === selectedStepIdx && e.target.closest("select, input, button, textarea")) return;
          if (i !== selectedStepIdx) {
            const targetTag = e.target.tagName;
            const fieldIdx = [...div.querySelectorAll("select, input, textarea")].indexOf(e.target.closest("select, input, textarea"));
            selectedStepIdx = i;
            renderSteps();
            if (fieldIdx >= 0) {
              const newCard = document.getElementById("steps-list").children[i];
              const fields = newCard?.querySelectorAll("select, input, textarea");
              if (fields && fields[fieldIdx]) fields[fieldIdx].focus();
            }
          }
        });
        div.addEventListener("dragstart", (e) => { dragSrcIdx = i; e.dataTransfer.effectAllowed = "move"; });
        div.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; div.classList.add("drag-over"); });
        div.addEventListener("dragleave", () => div.classList.remove("drag-over"));
        div.addEventListener("drop", (e) => {
          e.preventDefault();
          div.classList.remove("drag-over");
          if (dragSrcIdx === null || dragSrcIdx === i) return;
          const [moved] = script.steps.splice(dragSrcIdx, 1);
          script.steps.splice(i, 0, moved);
          selectedStepIdx = i;
          dragSrcIdx = null;
          renderSteps();
          updatePreview();
        });

        // Type selector
        const select = document.createElement("select");
        select.className = "step-type-select";
        ["Add Date/Time", "Add Metadata - Audio", "Add Metadata - Photo", "Add Metadata - Video", "Add Prefix", "Add Sequence Number", "Add Suffix", "Add/Replace Hash", "Convert Case", "Find & Replace", "Insert at Position", "Pad Number", "Regular Expression", "Remove Text", "Replace Spaces", "Sanitize", "Swap", "Trim"].forEach(t => {
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = t;
          if (step.type === t) opt.selected = true;
          select.appendChild(opt);
        });
        select.addEventListener("change", () => {
          step.type = select.value;
          resetStepFields(step);
          renderSteps();
          updatePreview();
        });
        div.appendChild(select);

        // Fields
        const fields = document.createElement("div");
        fields.className = "step-fields";
        buildStepFields(fields, step, i);
        if (!licensed && PREMIUM_STEPS.includes(step.type)) {
          fields.style.opacity = "0.4";
          fields.style.pointerEvents = "none";
          fields.querySelectorAll("input, select, textarea, button").forEach(el => { el.tabIndex = -1; });
        }
        div.appendChild(fields);

        list.appendChild(div);
      });
    }

    function resetStepFields(step) {
      const type = step.type;
      Object.keys(step).forEach(k => { if (k !== "type") delete step[k]; });
      if (type === "Find & Replace") { step.applyTo = "name"; step.find = ""; step.replace = ""; step.matchCase = false; step.firstOnly = false; }
      else if (type === "Regular Expression") { step.applyTo = "name"; step.pattern = ""; step.replace = ""; step.matchCase = false; step.firstOnly = false; }
      else if (type === "Remove Text") { step.remove = ""; step.matchCase = false; step.firstOnly = false; }
      else if (type === "Insert at Position") { step.text = ""; step.position = 0; step.fromEnd = false; }
      else if (type === "Trim") { step.count = 1; step.fromEnd = false; }
      else if (type === "Swap") { step.delimiter = " - "; }
      else if (type === "Add Prefix") { step.prefix = ""; }
      else if (type === "Add Suffix") { step.suffix = ""; }
      else if (type === "Add Date/Time") { step.dateSource = "current"; step.format = ""; step.tokenFormats = {}; }
      else if (type === "Add Metadata - Photo") { step.format = ""; }
      else if (type === "Add Metadata - Audio") { step.format = ""; }
      else if (type === "Add Metadata - Video") { step.format = ""; }
      else if (type === "Add/Replace Hash") { step.mode = "add"; step.algorithm = "md5"; step.length = 8; step.position = "suffix"; step.separator = "_"; }
      else if (type === "Add Sequence Number") { step.start = 1; step.stepVal = 1; step.padding = 3; step.position = "prefix"; step.separator = "_"; }
      else if (type === "Pad Number") { step.width = 3; }
      else if (type === "Replace Spaces") { step.replaceWith = "_"; }
      else if (type === "Sanitize") { step.replacement = "_"; }
      else if (type === "Convert Case") { step.applyTo = "name"; step.caseType = "lower"; }
    }

    function buildStepFields(container, step, idx) {
      const onChange = () => updatePreview();

      if (step.type === "Find & Replace") {
        container.appendChild(makeApplyTo(step, onChange));
        container.appendChild(makeInput("Find:", step, "find", onChange));
        container.appendChild(makeInput("Replace:", step, "replace", onChange));
        container.appendChild(makeCheckbox("Match Case", step, "matchCase", onChange));
        container.appendChild(makeCheckbox("First Match Only", step, "firstOnly", onChange));
      } else if (step.type === "Regular Expression") {
        container.appendChild(makeApplyTo(step, onChange));
        container.appendChild(makeInput("Pattern:", step, "pattern", onChange));
        container.appendChild(makeInput("Replace:", step, "replace", onChange));
        container.appendChild(makeCheckbox("Match Case", step, "matchCase", onChange));
        container.appendChild(makeCheckbox("First Match Only", step, "firstOnly", onChange));
      } else if (step.type === "Remove Text") {
        container.appendChild(makeInput("Remove:", step, "remove", onChange));
        container.appendChild(makeCheckbox("Match Case", step, "matchCase", onChange));
        container.appendChild(makeCheckbox("First Match Only", step, "firstOnly", onChange));
      } else if (step.type === "Insert at Position") {
        container.appendChild(makeInput("Text:", step, "text", onChange));
        container.appendChild(makeInput("Position:", step, "position", onChange));
        container.appendChild(makeCheckbox("From End", step, "fromEnd", onChange));
      } else if (step.type === "Trim") {
        container.appendChild(makeInput("Count:", step, "count", onChange));
        container.appendChild(makeCheckbox("From End", step, "fromEnd", onChange));
      } else if (step.type === "Swap") {
        container.appendChild(makeInput("Delimiter:", step, "delimiter", onChange));
      } else if (step.type === "Add Prefix") {
        container.appendChild(makeInput("Prefix:", step, "prefix", onChange));
      } else if (step.type === "Add Suffix") {
        container.appendChild(makeInput("Suffix:", step, "suffix", onChange));
      } else if (step.type === "Add Date/Time") {
        container.appendChild(makeDateTimeFields(step, onChange));
      } else if (step.type === "Add Metadata - Photo") {
        container.appendChild(makePhotoMetaFields(step, onChange));
      } else if (step.type === "Add Metadata - Audio") {
        container.appendChild(makeAudioMetaFields(step, onChange));
      } else if (step.type === "Add Metadata - Video") {
        container.appendChild(makeVideoMetaFields(step, onChange));
      } else if (step.type === "Add/Replace Hash") {
        container.appendChild(makeRadio("Mode:", step, "mode", [["add","Add"],["replace","Replace"],["remove","Remove"]], onChange));
        container.appendChild(makeSelect("Algorithm:", step, "algorithm", [["md5","MD5"],["sha1","SHA1"],["sha256","SHA256"]], onChange));
        container.appendChild(makeInput("Length:", step, "length", onChange));
        container.appendChild(makeSelect("Position:", step, "position", [["prefix","Prefix"],["suffix","Suffix"],["replace","Replace Name"]], onChange));
        container.appendChild(makeInput("Separator:", step, "separator", onChange));
      } else if (step.type === "Add Sequence Number") {
        container.appendChild(makeInput("Start:", step, "start", onChange));
        container.appendChild(makeInput("Step:", step, "stepVal", onChange));
        container.appendChild(makeInput("Padding:", step, "padding", onChange));
        container.appendChild(makeSelect("Position:", step, "position", [["prefix","Prefix"],["suffix","Suffix"]], onChange));
        container.appendChild(makeInput("Separator:", step, "separator", onChange));
      } else if (step.type === "Pad Number") {
        container.appendChild(makeInput("Width:", step, "width", onChange));
      } else if (step.type === "Replace Spaces") {
        container.appendChild(makeSelect("Replace With:", step, "replaceWith", [["_","Underscore (_)"],["-","Hyphen (-)"],["","Remove"]], onChange));
      } else if (step.type === "Sanitize") {
        container.appendChild(makeInput("Replace With:", step, "replacement", onChange));
      } else if (step.type === "Convert Case") {
        container.appendChild(makeApplyTo(step, onChange));
        container.appendChild(makeCaseButtons(step, onChange));
      }
    }

    function makeApplyTo(step, onChange) {
      const div = document.createElement("div");
      div.className = "field-row";
      div.innerHTML = `<label>Apply To:</label>`;
      const sel = document.createElement("select");
      [["name", "Name Only"], ["ext", "Extension Only"], ["both", "Name and Extension"]].forEach(([v, l]) => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = l;
        if (step.applyTo === v) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", () => { step.applyTo = sel.value; onChange(); });
      div.appendChild(sel);
      return div;
    }

    function makeInput(label, step, key, onChange) {
      const div = document.createElement("div");
      div.className = "field-row";
      div.innerHTML = `<label>${label}</label>`;
      const input = document.createElement("input");
      input.type = "text";
      input.value = step[key] || "";
      input.addEventListener("input", () => { step[key] = input.value; onChange(); });
      div.appendChild(input);
      return div;
    }

    function makeCheckbox(label, step, key, onChange) {
      const div = document.createElement("div");
      div.className = "field-row";
      const lbl = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!step[key];
      cb.addEventListener("change", () => { step[key] = cb.checked; onChange(); });
      lbl.appendChild(cb);
      lbl.append(" " + label);
      div.appendChild(lbl);
      return div;
    }

    function makeSelect(label, step, key, options, onChange) {
      const div = document.createElement("div");
      div.className = "field-row";
      div.innerHTML = `<label>${label}</label>`;
      const sel = document.createElement("select");
      options.forEach(([v, l]) => {
        const opt = document.createElement("option");
        opt.value = v; opt.textContent = l;
        if (String(step[key]) === v) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", () => { step[key] = sel.value; onChange(); });
      div.appendChild(sel);
      return div;
    }

    function makeRadio(label, step, key, options, onChange) {
      const div = document.createElement("div");
      div.className = "field-row";
      div.innerHTML = `<label>${label}</label>`;
      options.forEach(([v, l]) => {
        const lbl = document.createElement("label");
        lbl.style.cssText = "display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:12px;color:#e0e0e0;cursor:pointer";
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = key + "-radio";
        radio.value = v;
        radio.checked = step[key] === v;
        radio.addEventListener("change", () => { step[key] = v; onChange(); });
        lbl.appendChild(radio);
        lbl.append(l);
        div.appendChild(lbl);
      });
      return div;
    }

    function makeCaseButtons(step, onChange) {
      const div = document.createElement("div");
      div.className = "field-row case-buttons";
      div.innerHTML = `<label>Case:</label>`;
      [["lower", "ab"], ["upper", "AB"], ["title", "Ab"]].forEach(([v, l]) => {
        const btn = document.createElement("button");
        btn.textContent = l;
        btn.className = "case-btn" + (step.caseType === v ? " active" : "");
        btn.addEventListener("click", (e) => { e.stopPropagation(); step.caseType = v; onChange(); renderSteps(); });
        div.appendChild(btn);
      });
      return div;
    }

    // --- Add Date/Time Step ---
    const DATE_TOKENS = [
      { id: "Filename", label: "Filename", formats: null },
      { id: "Year", label: "Year", formats: ["YY", "YYYY"] },
      { id: "Month", label: "Month", formats: ["M", "MM", "MMM", "Month"] },
      { id: "Day", label: "Day", formats: ["D", "DD"] },
      { id: "Hour", label: "Hour", formats: ["0", "00", "1", "11"] },
      { id: "Minute", label: "Minute", formats: ["M", "MM"] },
      { id: "Second", label: "Second", formats: ["S", "SS"] },
      { id: "AMPM", label: "AM/PM", formats: null },
    ];

    function makeDateTimeFields(step, onChange) {
      const wrapper = document.createElement("div");
      wrapper.className = "datetime-fields";

      // Date source selector
      const srcRow = document.createElement("div");
      srcRow.className = "field-row";
      srcRow.innerHTML = `<label>Date/Time:</label>`;
      const srcSel = document.createElement("select");
      [["current", "Current"], ["created", "File Created"], ["modified", "File Last Modified"], ["exifOriginal", "EXIF Date/Time Original"], ["exifDigitized", "EXIF Date/Time Digitized"]].forEach(([v, l]) => {
        const opt = document.createElement("option");
        opt.value = v; opt.textContent = l;
        if (step.dateSource === v) opt.selected = true;
        srcSel.appendChild(opt);
      });
      srcSel.addEventListener("change", () => { step.dateSource = srcSel.value; onChange(); });
      srcRow.appendChild(srcSel);
      wrapper.appendChild(srcRow);

      // Format field
      const fmtRow = document.createElement("div");
      fmtRow.className = "field-col";
      fmtRow.innerHTML = `<label>Format:</label>`;
      const fmtInput = document.createElement("textarea");
      fmtInput.className = "format-textarea";
      fmtInput.rows = 4;
      fmtInput.value = step.format || "";

      // Helper: find token boundaries at a position
      function findTokenAt(val, pos) {
        let start = -1, end = -1;
        for (let i = pos; i >= 0; i--) { if (val[i] === "{") { start = i; break; } if (val[i] === "}" && i < pos) break; }
        if (start < 0) return null;
        end = val.indexOf("}", start);
        if (end < 0 || pos > end) return null;
        return { start, end: end + 1, text: val.slice(start, end + 1) };
      }

      function getTokenId(tokenText) {
        const m = tokenText.match(/^\{(\w+)/);
        return m ? m[1] : null;
      }

      // Single click: select whole token if inside one
      fmtInput.addEventListener("click", (e) => {
        const pos = fmtInput.selectionStart;
        const tok = findTokenAt(fmtInput.value, pos);
        if (tok) {
          e.preventDefault();
          fmtInput.setSelectionRange(tok.start, tok.end);
        }
      });

      // Right-click: show format options for token
      fmtInput.addEventListener("contextmenu", (e) => {
        const pos = fmtInput.selectionStart;
        const val = fmtInput.value;
        const tok = findTokenAt(val, pos);
        if (!tok) return;
        e.preventDefault();
        e.stopPropagation();
        const tokId = getTokenId(tok.text);
        const tokDef = DATE_TOKENS.find(t => t.id === tokId);
        if (!tokDef || !tokDef.formats) return;
        // Extract format from this specific token instance
        const fmtMatch = tok.text.match(/^\{\w+:([^}]*)\}$/);
        const currentFmt = fmtMatch ? fmtMatch[1] : (tokDef.formats[tokDef.formats.length > 1 ? 1 : 0]);
        const items = tokDef.formats.map(f => ({ label: f, tokId, fmt: f, checked: f === currentFmt }));
        ipcRenderer.invoke("show-token-format-menu-v2", items, tok.start, tok.end);
      });

      // Undo/redo history
      const fmtHistory = [step.format || ""];
      let fmtHistoryIdx = 0;
      const fmtPush = () => {
        fmtHistory.splice(fmtHistoryIdx + 1);
        fmtHistory.push(fmtInput.value);
        fmtHistoryIdx = fmtHistory.length - 1;
      };

      fmtInput.addEventListener("keydown", (e) => {
        // Undo
        if ((e.metaKey || e.ctrlKey) && e.key === "z" && !e.shiftKey) {
          e.preventDefault();
          if (fmtHistoryIdx > 0) {
            fmtHistoryIdx--;
            fmtInput.value = fmtHistory[fmtHistoryIdx];
            step.format = fmtInput.value;
            onChange();
          }
          return;
        }
        // Redo
        if ((e.metaKey || e.ctrlKey) && (e.key === "y" || (e.shiftKey && e.key === "z") || (e.shiftKey && e.key === "Z"))) {

            return;
          }
          if (selStart > 0 && val[selStart - 1] === "}") {
            const start = val.lastIndexOf("{", selStart - 1);
            if (start >= 0) {
              e.preventDefault();
              fmtInput.value = val.slice(0, start) + val.slice(selStart);
              fmtInput.setSelectionRange(start, start);
              step.format = fmtInput.value;
              fmtPush();
              onChange();
            }

      });
      fmtInput.addEventListener("input", () => { step.format = fmtInput.value; fmtPush(); onChange(); });
      fmtInput.addEventListener("dragover", (e) => e.preventDefault());
      fmtInput.addEventListener("drop", (e) => {
        e.preventDefault();

        const pos = fmtInput.selectionStart || fmtInput.value.length;
        fmtInput.value = fmtInput.value.slice(0, pos) + token + fmtInput.value.slice(pos);
        step.format = fmtInput.value;
        fmtPush();
        onChange();
      });

    }

    // --- Add Metadata - Photo Step ---

    function makePhotoMetaFields(step, onChange) {

    function applyPhotoMeta(step, name, ext, filePath) {
      if (!filePath || !step.format) return [name, ext];
      const meta = getPhotoMetadata(filePath);
      if (!meta) return [name, ext];
      let result = step.format;
      result = result.replace(/\{Filename\}/g, name);
      result = result.replace(/\{Width\}/g, meta.width != null ? String(meta.width) : "");
      result = result.replace(/\{Height\}/g, meta.height != null ? String(meta.height) : "");
      result = result.replace(/\{DPIWidth\}/g, meta.dpiWidth != null ? String(meta.dpiWidth) : "");
      result = result.replace(/\{DPIHeight\}/g, meta.dpiHeight != null ? String(meta.dpiHeight) : "");
      result = result.replace(/\{Longitude\}/g, meta.longitude != null ? meta.longitude.toFixed(6) : "");
      result = result.replace(/\{Latitude\}/g, meta.latitude != null ? meta.latitude.toFixed(6) : "");
      result = result.replace(/\{Altitude\}/g, meta.altitude != null ? meta.altitude.toFixed(1) : "");
      return [result, ext];
    }

    function getPhotoMetadata(filePath) {
      // Try exiftool first (supports JPEG, TIFF, PNG, WebP, HEIC, RAW, etc.)
      try {
        const exiftool = getExiftoolPath();
        if (!exiftool) throw new Error("not found");
        const out = execFileSync(exiftool, ["-json", "-ImageWidth", "-ImageHeight", "-XResolution", "-YResolution", "-GPSLatitude#", "-GPSLongitude#", "-GPSAltitude#", filePath], { timeout: 5000, encoding: "utf8" });
        const meta = JSON.parse(out)[0];
        if (!meta) return null;
        return {
          width: meta.ImageWidth || null,
          height: meta.ImageHeight || null,
          dpiWidth: meta.XResolution ? Math.round(meta.XResolution) : null,
          dpiHeight: meta.YResolution ? Math.round(meta.YResolution) : null,
          latitude: meta.GPSLatitude != null ? meta.GPSLatitude : null,
          longitude: meta.GPSLongitude != null ? meta.GPSLongitude : null,
          altitude: meta.GPSAltitude != null ? meta.GPSAltitude : null,
        };
      } catch { /* exiftool not available, fall through */ }

      // Fallback: parse JPEG EXIF directly
      try {
        const buf = Buffer.alloc(65536);
        const fd = fs.openSync(filePath, "r");
        const bytesRead = fs.readSync(fd, buf, 0, 65536, 0);
        fs.closeSync(fd);
        if (bytesRead < 12 || buf[0] !== 0xFF || buf[1] !== 0xD8) return null;
        let offset = 2;
        while (offset < bytesRead - 4) {
          if (buf[offset] !== 0xFF) return null;
          const marker = buf[offset + 1];
          const len = buf.readUInt16BE(offset + 2);
          if (marker === 0xE1) {
            const exif = buf.slice(offset + 4, offset + 2 + len);
            if (exif.slice(0, 4).toString() !== "Exif") return null;
            return parsePhotoExif(exif.slice(6));
          }
          offset += 2 + len;
        }
      } catch { return null; }
      return null;
    }

    function parsePhotoExif(tiff) {
      try {
        const le = tiff.readUInt16BE(0) === 0x4949;
        const r16 = (o) => le ? tiff.readUInt16LE(o) : tiff.readUInt16BE(o);
        const r32 = (o) => le ? tiff.readUInt32LE(o) : tiff.readUInt32BE(o);
        const rational = (o) => r32(o) / r32(o + 4);

        let ifdOff = r32(4);
        let count = r16(ifdOff);
        let exifIfdOff = 0, gpsIfdOff = 0;
        let width = null, height = null;
        let dpiWidth = null, dpiHeight = null;

        // IFD0
        for (let i = 0; i < count; i++) {
          const entry = ifdOff + 2 + i * 12;
          const tag = r16(entry);
          if (tag === 0x8769) exifIfdOff = r32(entry + 8);
          if (tag === 0x8825) gpsIfdOff = r32(entry + 8);
          if (tag === 0xA002) width = r32(entry + 8);
          if (tag === 0xA003) height = r32(entry + 8);
          if (tag === 0x011A) dpiWidth = Math.round(rational(r32(entry + 8)));
          if (tag === 0x011B) dpiHeight = Math.round(rational(r32(entry + 8)));
        }

        // ExifIFD for dimensions
        if (exifIfdOff) {
          count = r16(exifIfdOff);
          for (let i = 0; i < count; i++) {
            const entry = exifIfdOff + 2 + i * 12;
            const tag = r16(entry);
            if (tag === 0xA002) width = r32(entry + 8);
            if (tag === 0xA003) height = r32(entry + 8);
          }
        }

        // GPS IFD
        let latitude = null, longitude = null, altitude = null;
        if (gpsIfdOff) {
          count = r16(gpsIfdOff);
          let latRef = "N", lonRef = "E";
          let latVals = null, lonVals = null;
          for (let i = 0; i < count; i++) {
            const entry = gpsIfdOff + 2 + i * 12;
            const tag = r16(entry);
            const valOff = r32(entry + 8);
            if (tag === 1) latRef = String.fromCharCode(tiff[entry + 8]);
            if (tag === 2) latVals = [rational(valOff), rational(valOff + 8), rational(valOff + 16)];
            if (tag === 3) lonRef = String.fromCharCode(tiff[entry + 8]);
            if (tag === 4) lonVals = [rational(valOff), rational(valOff + 8), rational(valOff + 16)];
            if (tag === 6) altitude = rational(valOff);
          }
          if (latVals) latitude = (latVals[0] + latVals[1] / 60 + latVals[2] / 3600) * (latRef === "S" ? -1 : 1);
          if (lonVals) longitude = (lonVals[0] + lonVals[1] / 60 + lonVals[2] / 3600) * (lonRef === "W" ? -1 : 1);
        }

        return { width, height, dpiWidth, dpiHeight, latitude, longitude, altitude };
      } catch { return null; }
    }

    // --- Add Metadata - Audio Step ---
    const AUDIO_TOKENS = [
      { id: "Filename", label: "Filename" },
      { id: "Title", label: "Title" },
      { id: "Artist", label: "Artist" },
      { id: "Album", label: "Album" },
      { id: "Track", label: "Track" },
      { id: "Year", label: "Year" },
      { id: "Genre", label: "Genre" },

    function makeAudioMetaFields(step, onChange) {

    function applyAudioMeta(step, name, ext, filePath) {
      if (!filePath || !step.format) return [name, ext];
      const meta = getID3Tags(filePath);
      if (!meta) return [name, ext];
      let result = step.format;
      result = result.replace(/\{Filename\}/g, name);
      result = result.replace(/\{Title\}/g, meta.title || "");
      result = result.replace(/\{Artist\}/g, meta.artist || "");
      result = result.replace(/\{Album\}/g, meta.album || "");
      result = result.replace(/\{Track\}/g, meta.track || "");
      result = result.replace(/\{Year\}/g, meta.year || "");
      result = result.replace(/\{Genre\}/g, meta.genre || "");
      return [result, ext];
    }

    function getID3Tags(filePath) {
      // Try ffprobe first (supports MP3, FLAC, M4A, OGG, WMA, WAV, AIFF, etc.)
      try {
        const ffprobe = getFFprobePath();
        if (!ffprobe) throw new Error("not found");
        const out = execFileSync(ffprobe, [
          "-v", "quiet", "-print_format", "json", "-show_format", filePath
        ], { timeout: 5000, encoding: "utf8" });
        const info = JSON.parse(out);
        const t = info.format && info.format.tags ? info.format.tags : {};
        // Tag keys vary in case across formats
        const get = (keys) => { for (const k of keys) { const v = t[k] || t[k.toUpperCase()] || t[k.toLowerCase()]; if (v) return v; } return ""; };
        const tags = {
          title: get(["title", "TITLE"]),
          artist: get(["artist", "ARTIST", "ALBUMARTIST"]),
          album: get(["album", "ALBUM"]),
          track: get(["track", "TRACK", "TRACKNUMBER"]),
          year: get(["date", "DATE", "year", "YEAR"]),
          genre: get(["genre", "GENRE"]),
        };
        if (Object.values(tags).some(v => v)) return tags;
      } catch { /* ffprobe not available, fall through */ }

      // Fallback: parse MP3 ID3 tags directly
      try {
        const buf = Buffer.alloc(256);
        const fd = fs.openSync(filePath, "r");
        const stat = fs.fstatSync(fd);
        if (stat.size >= 128) {
          fs.readSync(fd, buf, 0, 128, stat.size - 128);
          if (buf.slice(0, 3).toString() === "TAG") {
            fs.closeSync(fd);
            return {
              title: buf.slice(3, 33).toString().replace(/\0/g, "").trim(),
              artist: buf.slice(33, 63).toString().replace(/\0/g, "").trim(),
              album: buf.slice(63, 93).toString().replace(/\0/g, "").trim(),
              year: buf.slice(93, 97).toString().replace(/\0/g, "").trim(),
              track: buf[126] ? String(buf[126]) : "",
              genre: "",
            };
          }
        }
        fs.readSync(fd, buf, 0, 10, 0);
        if (buf.slice(0, 3).toString() === "ID3") {
          const size = (buf[6] << 21) | (buf[7] << 14) | (buf[8] << 7) | buf[9];
          const hdr = Buffer.alloc(Math.min(size, 4096));
          fs.readSync(fd, hdr, 0, hdr.length, 10);
          fs.closeSync(fd);
          const tags = {};
          let off = 0;
          while (off < hdr.length - 10) {
            const id = hdr.slice(off, off + 4).toString();
            if (id[0] === "\0") break;
            const fsize = hdr.readUInt32BE(off + 4);
            if (fsize <= 0 || off + 10 + fsize > hdr.length) break;
            const val = hdr.slice(off + 11, off + 10 + fsize).toString().replace(/\0/g, "").trim();
            if (id === "TIT2") tags.title = val;
            else if (id === "TPE1") tags.artist = val;
            else if (id === "TALB") tags.album = val;
            else if (id === "TRCK") tags.track = val;
            else if (id === "TDRC" || id === "TYER") tags.year = val;
            else if (id === "TCON") tags.genre = val;
            off += 10 + fsize;
          }
          return Object.keys(tags).length ? tags : null;
        }
        fs.closeSync(fd);
      } catch { return null; }
      return null;
    }

    // --- Add Metadata - Video Step ---
    const VIDEO_TOKENS = [
      { id: "Filename", label: "Filename" },

    function applyVideoMeta(step, name, ext, filePath) {
      if (!filePath || !step.format) return [name, ext];
      const meta = getVideoMeta(filePath);
      if (!meta) return [name, ext];
      let result = step.format;

    function getVideoMeta(filePath) {
      // Try ffprobe first (supports all video formats)
      try {
        const ffprobe = getFFprobePath();
        if (!ffprobe) throw new Error("not found");
        const out = execFileSync(ffprobe, [
          "-v", "quiet", "-print_format", "json",
          "-show_format", "-show_streams", filePath
        ], { timeout: 5000, encoding: "utf8" });
        const info = JSON.parse(out);
        const vid = (info.streams || []).find(s => s.codec_type === "video");
        const width = vid ? parseInt(vid.width) || null : null;
        const height = vid ? parseInt(vid.height) || null : null;
        const dur = info.format && info.format.duration ? Math.round(parseFloat(info.format.duration)) + "s" : null;
        if (width || dur) return { width, height, duration: dur };
      } catch { /* ffprobe not available, fall through */ }

      // Fallback: parse MP4/MOV container directly
      try {
        const fd = fs.openSync(filePath, "r");
        const buf = Buffer.alloc(8);
        fs.readSync(fd, buf, 0, 8, 0);
        if (buf.slice(4, 8).toString() !== "ftyp") { fs.closeSync(fd); return null; }
        let offset = 0;
        const stat = fs.fstatSync(fd);
        while (offset < stat.size) {
          fs.readSync(fd, buf, 0, 8, offset);
          const size = buf.readUInt32BE(0);
          const type = buf.slice(4, 8).toString();
          if (size < 8) break;
          if (type === "moov") {
            const moov = Buffer.alloc(Math.min(size - 8, 65536));
            fs.readSync(fd, moov, 0, moov.length, offset + 8);
            fs.closeSync(fd);
            return parseMoov(moov);
          }
          offset += size;
        }
        fs.closeSync(fd);
      } catch { return null; }
      return null;
    }

    function parseMoov(moov) {
      let width = null, height = null, duration = null;
      let off = 0;
      while (off < moov.length - 8) {
        const size = moov.readUInt32BE(off);
        const type = moov.slice(off + 4, off + 8).toString();
        if (size < 8 || off + size > moov.length) break;
        if (type === "mvhd") {
          const ver = moov[off + 8];
          const ts = ver === 0 ? moov.readUInt32BE(off + 20) : moov.readUInt32BE(off + 28);
          const dur = ver === 0 ? moov.readUInt32BE(off + 24) : moov.readUInt32BE(off + 32);
          if (ts > 0) duration = String(Math.round(dur / ts)) + "s";
        }
        if (type === "tkhd") {
          const ver = moov[off + 8];
          const base = ver === 0 ? off + 84 : off + 96;
          if (base + 4 <= off + size) {
            const w = moov.readUInt32BE(base - 8) >> 16;
            const h = moov.readUInt32BE(base - 4) >> 16;
            if (w > 0 && h > 0) { width = w; height = h; }
          }
        }
        off += size;
      }
      if (width || duration) return { width, height, duration };
      return null;
    }

    // --- Add/Replace Hash ---
    function applyHash(step, name, ext, filePath) {
      if (!filePath) return [name, ext];
      try {
        const len = parseInt(step.length) || 8;
        const sep = step.separator || "";
        const escapedSep = sep ? sep.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") : "";
        const hexPat = `[0-9a-fA-F]+`;

        if (step.mode === "remove") {
          if (step.position === "prefix") {
            name = name.replace(new RegExp("^" + hexPat + escapedSep), "");
          } else {
            name = name.replace(new RegExp(escapedSep + hexPat + "$"), "");
          }
          return [name, ext];
        }

        const content = fs.readFileSync(filePath);
        const hash = nodeCrypto.createHash(step.algorithm || "md5").update(content).digest("hex").slice(0, len);
        if (step.position === "replace") return [hash, ext];
        if (step.mode === "replace") {
          if (step.position === "prefix") {
            name = name.replace(new RegExp("^" + hexPat + escapedSep), "");
          } else {
            name = name.replace(new RegExp(escapedSep + hexPat + "$"), "");
          }
        }
        if (step.position === "prefix") return [hash + sep + name, ext];
        return [name + sep + hash, ext];
      } catch { return [name, ext]; }
    }

      fmtInput.addEventListener("keydown", (e) => {

        if ((e.metaKey || e.ctrlKey) && (e.key === "y" || (e.shiftKey && (e.key === "z" || e.key === "Z")))) { e.preventDefault(); if (histIdx < hist.length - 1) { histIdx++; fmtInput.value = hist[histIdx]; step.format = fmtInput.value; onChange(); } return; }

    // --- Rename Engine ---
    function applyScript(filename, filePath, fileIndex) {
      const script = scripts[selectedScriptIdx];
      if (!script) return filename;
      const licensed = isLicensed();
      let dotIdx = filename.lastIndexOf(".");
      let name = dotIdx > 0 ? filename.slice(0, dotIdx) : filename;
      let ext = dotIdx > 0 ? filename.slice(dotIdx + 1) : "";

      for (const step of script.steps) {
        if (!licensed && PREMIUM_STEPS.includes(step.type)) continue;
        [name, ext] = applyStep(step, name, ext, filePath, fileIndex);
      }
      return ext ? name + "." + ext : name;
    }

    function applyStep(step, name, ext, filePath, fileIndex) {
      if (step.type === "Find & Replace") {
        const target = getTarget(step.applyTo, name, ext);
        const result = doReplace(target, step.find, step.replace, step.matchCase, step.firstOnly);
        return setTarget(step.applyTo, name, ext, result);
      } else if (step.type === "Regular Expression") {
        const target = getTarget(step.applyTo, name, ext);
        const result = doRegex(target, step.pattern, step.replace, step.matchCase, step.firstOnly);
        return setTarget(step.applyTo, name, ext, result);
      } else if (step.type === "Remove Text") {
        const result = doReplace(name, step.remove, "", step.matchCase, step.firstOnly);
        return [result, ext];
      } else if (step.type === "Insert at Position") {
        const pos = parseInt(step.position) || 0;
        const idx = step.fromEnd ? Math.max(0, name.length - pos) : Math.min(pos, name.length);
        return [name.slice(0, idx) + (step.text || "") + name.slice(idx), ext];
      } else if (step.type === "Trim") {
        const count = parseInt(step.count) || 0;
        if (step.fromEnd) return [name.slice(0, Math.max(0, name.length - count)), ext];
        return [name.slice(count), ext];
      } else if (step.type === "Swap") {
        const delim = step.delimiter || " - ";
        const idx = name.indexOf(delim);
        if (idx < 0) return [name, ext];
        return [name.slice(idx + delim.length) + delim + name.slice(0, idx), ext];
      } else if (step.type === "Add Prefix") {
        return [step.prefix + name, ext];
      } else if (step.type === "Add Suffix") {
        return [name + step.suffix, ext];
      } else if (step.type === "Add Date/Time") {
        return applyDateTime(step, name, ext, filePath);
      } else if (step.type === "Add Metadata - Photo") {
        return applyPhotoMeta(step, name, ext, filePath);
      } else if (step.type === "Add Metadata - Audio") {
        return applyAudioMeta(step, name, ext, filePath);
      } else if (step.type === "Add Metadata - Video") {
        return applyVideoMeta(step, name, ext, filePath);
      } else if (step.type === "Add/Replace Hash") {
        return applyHash(step, name, ext, filePath);
      } else if (step.type === "Add Sequence Number") {
        const num = String((parseInt(step.start) || 1) + fileIndex * (parseInt(step.stepVal) || 1)).padStart(parseInt(step.padding) || 0, "0");
        const sep = step.separator || "";
        if (step.position === "suffix") return [name + sep + num, ext];
        return [num + sep + name, ext];
      } else if (step.type === "Pad Number") {
        const width = parseInt(step.width) || 3;
        const result = name.replace(/\d+/g, m => m.padStart(width, "0"));
        return [result, ext];
      } else if (step.type === "Replace Spaces") {
        return [name.replace(/ /g, step.replaceWith || ""), ext];
      } else if (step.type === "Sanitize") {
        const repl = step.replacement || "_";
        return [name.replace(/[<>:"/\\|?*\x00-\x1f]/g, repl), ext];
      } else if (step.type === "Convert Case") {
        const target = getTarget(step.applyTo, name, ext);
        const result = convertCase(target, step.caseType);
        return setTarget(step.applyTo, name, ext, result);
      }
      return [name, ext];
    }

    function getTarget(applyTo, name, ext) {
      if (applyTo === "name") return name;
      if (applyTo === "ext") return ext;
      return ext ? name + "." + ext : name;
    }

    function setTarget(applyTo, name, ext, result) {
      if (applyTo === "name") return [result, ext];
      if (applyTo === "ext") return [name, result];
      const dotIdx = result.lastIndexOf(".");
      if (dotIdx > 0) return [result.slice(0, dotIdx), result.slice(dotIdx + 1)];
      return [result, ""];
    }

    function doReplace(str, find, replace, matchCase, firstOnly) {
      if (!find) return str;
      const flags = (matchCase ? "" : "i") + (firstOnly ? "" : "g");
      const escaped = find.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return str.replace(new RegExp(escaped, flags), replace);
    }

    function doRegex(str, pattern, replace, matchCase, firstOnly) {
      if (!pattern) return str;
      try {
        const flags = (matchCase ? "" : "i") + (firstOnly ? "" : "g");
        return str.replace(new RegExp(pattern, flags), replace);
      } catch { return str; }
    }

    function getExifDate(filePath, source) {
      if (!filePath) return null;
      try {
        const buf = Buffer.alloc(65536);
        const fd = fs.openSync(filePath, "r");
        const bytesRead = fs.readSync(fd, buf, 0, 65536, 0);
        fs.closeSync(fd);
        if (bytesRead < 12) return null;
        // Check JPEG SOI + APP1
        if (buf[0] !== 0xFF || buf[1] !== 0xD8) return null;
        let offset = 2;
        while (offset < bytesRead - 4) {
          if (buf[offset] !== 0xFF) return null;
          const marker = buf[offset + 1];
          const len = buf.readUInt16BE(offset + 2);
          if (marker === 0xE1) { // APP1
            const exif = buf.slice(offset + 4, offset + 2 + len);
            if (exif.slice(0, 4).toString() !== "Exif") return null;
            return parseExifDate(exif.slice(6), source);
          }
          offset += 2 + len;
        }
      } catch { return null; }
      return null;
    }

    function parseExifDate(tiff, source) {
      try {
        const le = tiff.readUInt16BE(0) === 0x4949;
        const r16 = (o) => le ? tiff.readUInt16LE(o) : tiff.readUInt16BE(o);
        const r32 = (o) => le ? tiff.readUInt32LE(o) : tiff.readUInt32BE(o);
        // Find IFD0
        let ifdOff = r32(4);
        const tagId = source === "exifDigitized" ? 0x9004 : 0x9003;
        // Search IFD0 for ExifIFD pointer (0x8769)
        let count = r16(ifdOff);
        let exifIfdOff = 0;
        for (let i = 0; i < count; i++) {
          const tag = r16(ifdOff + 2 + i * 12);
          if (tag === 0x8769) { exifIfdOff = r32(ifdOff + 2 + i * 12 + 8); break; }
        }
        if (!exifIfdOff) return null;
        // Search ExifIFD for date tag
        count = r16(exifIfdOff);
        for (let i = 0; i < count; i++) {
          const entry = exifIfdOff + 2 + i * 12;
          const tag = r16(entry);
          if (tag === tagId) {
            const valOff = r32(entry + 8);
            const str = tiff.slice(valOff, valOff + 19).toString();
            const [d, t] = str.split(" ");
            const [y, mo, dy] = d.split(":");
            const [h, mi, s] = t.split(":");
            return new Date(+y, +mo - 1, +dy, +h, +mi, +s);
          }
        }
      } catch { return null; }
      return null;
    }

    function applyDateTime(step, name, ext, filePath) {
      let date;
      if (step.dateSource === "current") {
        date = new Date();
      } else if (step.dateSource === "created" && filePath) {
        try { date = fs.statSync(filePath).birthtime; } catch { date = new Date(); }
      } else if (step.dateSource === "modified" && filePath) {
        try { date = fs.statSync(filePath).mtime; } catch { date = new Date(); }
      } else if (step.dateSource === "exifOriginal" || step.dateSource === "exifDigitized") {
        date = getExifDate(filePath, step.dateSource);
        if (!date) return [name, ext]; // No EXIF data, don't change name
      } else {
        date = new Date();
      }

      const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      const monthsShort = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const tf = step.tokenFormats || {};

      let result = step.format || "";
      result = result.replace(/\{Filename\}/g, name);
      result = result.replace(/\{Year(:[^}]*)?\}/g, (_m, f) => {
        const fmt = (f ? f.slice(1) : null) || tf.Year || "YYYY";
        return fmt === "YY" ? String(date.getFullYear()).slice(-2) : String(date.getFullYear());
      });
      result = result.replace(/\{Month(:[^}]*)?\}/g, (_m, f) => {
        const fmt = (f ? f.slice(1) : null) || tf.Month || "MM";
        if (fmt === "M") return String(date.getMonth() + 1);
        if (fmt === "MM") return String(date.getMonth() + 1).padStart(2, "0");
        if (fmt === "MMM") return monthsShort[date.getMonth()];
        return months[date.getMonth()];
      });
      result = result.replace(/\{Day(:[^}]*)?\}/g, (_m, f) => {
        const fmt = (f ? f.slice(1) : null) || tf.Day || "DD";
        return fmt === "D" ? String(date.getDate()) : String(date.getDate()).padStart(2, "0");
      });
      result = result.replace(/\{Hour(:[^}]*)?\}/g, (_m, f) => {
        const fmt = (f ? f.slice(1) : null) || tf.Hour || "00";
        const h = date.getHours();
        if (fmt === "1") return String(h % 12 || 12);
        if (fmt === "11") return String(h % 12 || 12).padStart(2, "0");
        if (fmt === "0") return String(h);
        return String(h).padStart(2, "0");
      });
      result = result.replace(/\{Minute(:[^}]*)?\}/g, (_m, f) => {
        const fmt = (f ? f.slice(1) : null) || tf.Minute || "MM";
        return fmt === "M" ? String(date.getMinutes()) : String(date.getMinutes()).padStart(2, "0");
      });
      result = result.replace(/\{Second(:[^}]*)?\}/g, (_m, f) => {
        const fmt = (f ? f.slice(1) : null) || tf.Second || "SS";
        return fmt === "S" ? String(date.getSeconds()) : String(date.getSeconds()).padStart(2, "0");
      });
      result = result.replace(/\{AMPM\}/g, () => date.getHours() < 12 ? "AM" : "PM");

      return [result, ext];
    }

    function convertCase(str, caseType) {
      if (caseType === "lower") return str.toLowerCase();
      if (caseType === "upper") return str.toUpperCase();
      return str.replace(/\b\w/g, c => c.toUpperCase()).replace(/\B\w/g, c => c.toLowerCase());
    }

    function updatePreview() {
      const tbody = document.getElementById("file-tbody");
      const settings = load();
      const evenColor = config.rowColorEven || "#000000";
      const oddColor = config.rowColorOdd || "#1a1a1a";
      const selColor = settings.fileHighlightColor || config.fileHighlightColor || "#2e7d32";

      // Disable new-name sort if script has order-dependent steps
      const orderDependent = scripts[selectedScriptIdx]?.steps?.some(s => s.type === "Add Sequence Number");
      if (orderDependent && sortCol === "new") { sortCol = "current"; sortAsc = true; }
      document.getElementById("col-new").style.opacity = orderDependent ? "0.4" : "";
      document.getElementById("col-new").style.cursor = orderDependent ? "default" : "";

      // Sort files into display order first
      const sorted = [...files];
      if (sortCol !== "manual") {
        const sortBy = sortCol === "new" ? "new" : "current";
        sorted.sort((a, b) => {
          const av = sortBy === "new" ? a.newName || a.name : a.name;
          const bv = sortBy === "new" ? b.newName || b.name : b.name;
          return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
        });
      }

      // Compute new names using display order index
      sorted.forEach((f, idx) => { f.newName = applyScript(f.name, f.path, idx); });
      // Deduplicate: test each directory for case sensitivity
      const caseSensitiveCache = {};
      function isDirCaseSensitive(dir) {
        if (caseSensitiveCache[dir] != null) return caseSensitiveCache[dir];
        try {
          const chars = "abcdefghijklmnopqrstuvwxyz";
          let rand = "temp_";
          for (let i = 0; i < 16; i++) rand += chars[Math.floor(Math.random() * 26)];
          const tmpPath = path.join(dir, rand);
          fs.writeFileSync(tmpPath, "RenameCheetah");
          const upperExists = fs.existsSync(path.join(dir, rand.toUpperCase()));
          fs.unlinkSync(tmpPath);
          caseSensitiveCache[dir] = !upperExists;
        } catch {
          caseSensitiveCache[dir] = process.platform === "linux";
        }
        return caseSensitiveCache[dir];
      }
      const normNameForDir = (n, dir) => isDirCaseSensitive(dir) ? n : n.toLowerCase();

      // Build set of existing files per directory (cached per updatePreview call)
      const dirFiles = {};
      const getExisting = (dir) => {
        if (!dirFiles[dir]) {
          try {
            dirFiles[dir] = new Set(fs.readdirSync(dir).map(n => normNameForDir(n, dir)));
          } catch { dirFiles[dir] = new Set(); }
        }
        return dirFiles[dir];
      };

      // Track claimed names per directory
      const claimed = {};
      sorted.forEach(f => {
        const dir = path.dirname(f.path);
        if (!claimed[dir]) claimed[dir] = {};
        const key = normNameForDir(f.newName, dir);
        claimed[dir][key] = (claimed[dir][key] || 0) + 1;
      });

      const assigned = {};
      sorted.forEach(f => {
        const dir = path.dirname(f.path);
        if (!assigned[dir]) assigned[dir] = {};
        const key = normNameForDir(f.newName, dir);
        const existing = getExisting(dir);
        // Needs suffix if: duplicate among batch, OR would clobber an existing file that isn't being renamed away
        const isDuplicate = claimed[dir][key] > 1;
        const wouldClobber = existing.has(key) && !sorted.some(o => normNameForDir(o.name, dir) === key && path.dirname(o.path) === dir);
        if (isDuplicate || wouldClobber) {
          assigned[dir][key] = (assigned[dir][key] || 0) + 1;
          let suffix = assigned[dir][key];
          const addSuffix = (name, s) => {
            const dotIdx = name.lastIndexOf(".");
            return dotIdx > 0 ? name.slice(0, dotIdx) + "-" + s + name.slice(dotIdx) : name + "-" + s;
          };
          // Ensure the suffixed name itself doesn't collide
          let candidate = addSuffix(f.newName, suffix);
          while (existing.has(normNameForDir(candidate, dir)) || assigned[dir][normNameForDir(candidate, dir)]) {
            suffix++;
            candidate = addSuffix(f.newName, suffix);
          }
          assigned[dir][key] = suffix;
          assigned[dir][normNameForDir(candidate, dir)] = -1; // mark as taken
          f.newName = candidate;
        } else {
          assigned[dir][key] = -1; // mark as taken
        }
      });

      let fileDragIdx = null;
      tbody.innerHTML = "";
      sorted.forEach((f, i) => {
        const tr = document.createElement("tr");
        const isSelected = selectedFiles.has(f);
        tr.style.background = isSelected ? selColor : (i % 2 === 0 ? evenColor : oddColor);
        const changed = f.name !== f.newName;
        const tdCurrent = document.createElement("td");
        tdCurrent.textContent = f.name;
        const tdNew = document.createElement("td");
        tdNew.textContent = f.newName;
        if (changed) tdNew.className = "changed";
        tr.appendChild(tdCurrent);
        tr.appendChild(document.createElement("td"));
        tr.appendChild(tdNew);

        // Drag to reorder
        tr.draggable = true;
        tr.addEventListener("dragstart", (e) => { fileDragIdx = i; e.dataTransfer.effectAllowed = "move"; });
        tr.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; tr.style.borderTop = "2px solid #0a84ff"; });
        tr.addEventListener("dragleave", () => { tr.style.borderTop = ""; });
        tr.addEventListener("drop", (e) => {
          e.preventDefault();
          e.stopPropagation();
          tr.style.borderTop = "";
          if (fileDragIdx === null || fileDragIdx === i) return;
          // Switch to manual order: reorder the files array to match sorted then apply the move
          files.length = 0;
          sorted.forEach(sf => files.push(sf));
          const [moved] = files.splice(fileDragIdx, 1);
          files.splice(i, 0, moved);
          sortCol = "manual";
          fileDragIdx = null;
          updatePreview();
        });
        tr.addEventListener("dragend", () => { fileDragIdx = null; });

        // Click to select/deselect (multi-select)
        tr.addEventListener("click", (e) => {
          if (e.target.tagName === "INPUT") return;
          if (e.metaKey || e.ctrlKey) {
            if (selectedFiles.has(f)) selectedFiles.delete(f); else selectedFiles.add(f);
          } else if (e.shiftKey && selectedFiles.size > 0) {
            const lastSelected = [...selectedFiles].pop();
            const lastIdx = sorted.indexOf(lastSelected);
            const curIdx = sorted.indexOf(f);
            const [start, end] = lastIdx < curIdx ? [lastIdx, curIdx] : [curIdx, lastIdx];
            for (let j = start; j <= end; j++) selectedFiles.add(sorted[j]);
          } else {
            selectedFiles.clear();
            selectedFiles.add(f);
          }
          updatePreview();
        });

        // Double-click current name to rename immediately
        tdCurrent.addEventListener("dblclick", () => {
          const input = document.createElement("input");
          input.type = "text";
          input.className = "inline-rename";
          input.value = f.name;
          tdCurrent.textContent = "";
          tdCurrent.appendChild(input);
          input.focus();
          input.select();
          const commit = () => {
            const val = input.value.trim();
            if (val && val !== f.name) {
              try {
                const newPath = path.join(path.dirname(f.path), val);
                fs.renameSync(f.path, newPath);
                f.path = newPath;
                f.name = val;
              } catch (err) { alert("Rename failed: " + err.message); }
            }
            updatePreview();
          };
          input.addEventListener("blur", commit);
          input.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") input.blur();
            if (ev.key === "Escape") { input.value = f.name; input.blur(); }
          });
        });

        // Right-click context menu
        tr.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          if (!selectedFiles.has(f)) { selectedFiles.clear(); selectedFiles.add(f); updatePreview(); }
          ipcRenderer.invoke("show-file-context-menu", selectedFiles.size > 0);
        });

        tbody.appendChild(tr);
      });

      // Context menu on empty area of table is handled outside updatePreview

      // Status
      const toRename = files.filter(f => f.name !== f.newName).length;
      const statusEl = document.getElementById("status-text");
      if (files.length === 0) {
        statusEl.textContent = "Drop files to begin";
      } else {
        statusEl.textContent = `${toRename} of ${files.length} file${files.length !== 1 ? "s" : ""} to be renamed`;
      }

      // Rename button
      document.getElementById("rename-btn").disabled = toRename === 0;

      // Update menu enabled state
      ipcRenderer.invoke("update-selection", selectedFiles.size > 0);

      // Sort arrows
      document.querySelector("#col-current .sort-arrow").textContent = sortCol === "current" ? (sortAsc ? "▲" : "▼") : "";
      document.querySelector("#col-new .sort-arrow").textContent = sortCol === "new" ? (sortAsc ? "▲" : "▼") : "";
    }

    function escHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Sort handlers
    document.getElementById("col-current").addEventListener("click", () => {
      if (sortCol === "current") sortAsc = !sortAsc; else { sortCol = "current"; sortAsc = true; }
      updatePreview();
    });
    function hasOrderDependentStep() {
      const script = scripts[selectedScriptIdx];
      return script && script.steps.some(s => s.type === "Add Sequence Number");
    }

    document.getElementById("col-new").addEventListener("click", () => {
      if (hasOrderDependentStep()) return;
      if (sortCol === "new") sortAsc = !sortAsc; else { sortCol = "new"; sortAsc = true; }
      updatePreview();
    });

    // Remove selected files on Backspace/Delete
    document.addEventListener("keydown", (e) => {
      if ((e.key === "Backspace" || e.key === "Delete") && selectedFiles.size > 0 && !e.target.closest("input, textarea, select")) {
        e.preventDefault();
        files = files.filter(f => !selectedFiles.has(f));
        selectedFiles.clear();
        updatePreview();
      }
    });

    // Rename button
    document.getElementById("rename-btn").addEventListener("click", async () => {
      const toRename = files.filter(f => f.name !== f.newName);
      if (toRename.length === 0) return;
      const result = await ipcRenderer.invoke("rename-files", toRename.map(f => ({ oldPath: f.path, newPath: path.join(path.dirname(f.path), f.newName) })));
      if (result.error) {
        alert("Error: " + result.error);
      } else {
        // Update file list with new names
        toRename.forEach(f => {
          f.path = path.join(path.dirname(f.path), f.newName);
          f.name = f.newName;
        });
        updatePreview();
      }
    });

    // --- Resizable Dividers ---
    function saveDividerPositions() {
      const settings = load();
      settings.panelWidths = {
        left: document.getElementById("left-panel").getBoundingClientRect().width,
        middle: document.getElementById("middle-panel").getBoundingClientRect().width,
      };
      save(settings);
    }

    function restoreDividerPositions() {
      const settings = load();
      if (settings.panelWidths) {
        document.getElementById("left-panel").style.width = settings.panelWidths.left + "px";
        document.getElementById("middle-panel").style.width = settings.panelWidths.middle + "px";
      }
    }

    function initDivider(dividerId, leftPanel, rightPanel, isRightDivider) {
      const divider = document.getElementById(dividerId);
      let startX, startLeftW;
      divider.addEventListener("mousedown", (e) => {
        e.preventDefault();
        startX = e.clientX;
        startLeftW = leftPanel.getBoundingClientRect().width;
        divider.classList.add("active");
        const onMove = (e) => {
          const dx = e.clientX - startX;
          leftPanel.style.width = Math.max(100, startLeftW + dx) + "px";
        };
        const onUp = () => {
          divider.classList.remove("active");
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
          saveDividerPositions();
        };
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });
    }

    initDivider("divider-left", document.getElementById("left-panel"), document.getElementById("middle-panel"));
    initDivider("divider-right", document.getElementById("middle-panel"), document.getElementById("right-panel"));

    // Column divider
    const colDivider = document.getElementById("col-divider");
    const colCurrent = document.getElementById("col-current");
    (() => {
      let startX, startW;
      colDivider.addEventListener("mousedown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        startX = e.clientX;
        startW = colCurrent.offsetWidth;
        colDivider.classList.add("active");
        const table = document.getElementById("file-table");
        const onMove = (e) => {
          const pct = Math.max(10, Math.min(90, ((startW + e.clientX - startX) / table.offsetWidth) * 100));
          colCurrent.style.width = pct + "%";
        };
        const onUp = () => {
          colDivider.classList.remove("active");
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
        };
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });
    })();

    restoreDividerPositions();

    init();
  </script>
</body>
</html>
