<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    h1 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }

    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }

    input, select {
      width: 100%;
      background: #3a3a3c;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus, select:focus { border-color: #0a84ff; }
    input[type="color"] { height: 32px; padding: 2px; cursor: pointer; }

    .color-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .color-field { flex: 1; }
    .color-field label { margin-bottom: 4px; }
    .color-field input { width: 100%; }

    .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: auto; }

    button {
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }
    #cancel-btn { background: #3a3a3c; color: #e0e0e0; }
    #save-btn   { background: #0a84ff; color: #fff; }
  </style>
</head>
<body>
  <h1>Settings</h1>

  <div class="color-row">
    <div class="color-field">
      <label for="script-highlight-color">Script Highlight</label>
      <input type="color" id="script-highlight-color" value="#0a84ff">
    </div>
    <div class="color-field">
      <label for="step-highlight-color">Step Highlight</label>
      <input type="color" id="step-highlight-color" value="#0a84ff">
    </div>
    <div class="color-field">
      <label for="file-highlight-color">File Highlight</label>
      <input type="color" id="file-highlight-color" value="#2e7d32">
    </div>
  </div>

  <div class="row">
    <button id="cancel-btn">Cancel</button>
    <button id="save-btn">Save</button>
  </div>

  <script>
    const { ipcRenderer } = require("electron");

    let current = {};

    ipcRenderer.invoke("settings-get-data").then(({ settings, config }) => {
      current = settings;
      document.getElementById("script-highlight-color").value = settings.scriptHighlightColor || config.scriptHighlightColor || "#0a84ff";
      document.getElementById("step-highlight-color").value = settings.stepHighlightColor || config.stepHighlightColor || "#0a84ff";
      document.getElementById("file-highlight-color").value = settings.fileHighlightColor || config.fileHighlightColor || "#2e7d32";
    });

    document.getElementById("save-btn").addEventListener("click", () => {
      current.scriptHighlightColor = document.getElementById("script-highlight-color").value;
      current.stepHighlightColor = document.getElementById("step-highlight-color").value;
      current.fileHighlightColor = document.getElementById("file-highlight-color").value;
      ipcRenderer.invoke("settings-save", current);
    });

    document.getElementById("cancel-btn").addEventListener("click", () => {
      ipcRenderer.invoke("settings-cancel");
    });
  </script>
</body>
</html>
